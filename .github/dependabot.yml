version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    # Dependabot does not read minimumReleaseAge in bunfig.toml, so this repeats it, and
    # guards/config-policy.test.ts fails when it is shorter. See
    # docs/adr/0012-pin-dependencies-and-update-with-dependabot.md.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      # cf is a pinned beta (ADR 0006), so it gets a pull request of its own. Dependabot puts each
      # dependency in the first group it matches, so packages takes everything but cf.
      cf:
        patterns: [cf]
      packages:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
