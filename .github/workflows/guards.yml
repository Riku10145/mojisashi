name: Guards

# Runs from the base branch, never from the pull request: pull_request_target reads this file and
# .github/guarded-paths from the base. It reads git history only and runs no code from the pull
# request, so the pull request it judges cannot switch it off. It enforces only once it is a
# required check under branch protection; until then it reports.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  guards-unchanged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head:pr-head"
      - run: bash .github/guards-unchanged.sh "${{ github.event.pull_request.base.sha }}" pr-head
